# CI (plan-v3-team §9.1, §6.5). `release.yml` is P-GH's; the weekly `cargo deny` job is TM25's.
#
# Ubuntu: scripts/check.sh, the Postgres and Pebble test lines, hook-nonet (when TM13 has landed
# it), the systemd unit checks, the container image, the three self-hosting smoke modes (and the
# seeded restore), shellcheck. macOS: scripts/check.sh only.
#
# No secrets are used anywhere: the Postgres service container has throw-away credentials and
# the pull_request trigger from a fork gets a read-only token.
name: ci

on:
  push:
    branches: [main, team]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awm
          POSTGRES_PASSWORD: awm
          POSTGRES_DB: awm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awm -d awm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A superuser URL: the tests create their own schemas and the awm_owner / awm_app roles,
      # the smoke script its own database and roles. Without it every Postgres case would
      # return early and pass (TM26), so it is set for the whole job.
      AWM_TEST_PG_URL: postgres://awm:awm@127.0.0.1:5432/awm_test
      # Pebble (the local ACME server of the TLS tests and the smoke): pinned release, archive
      # verified against PEBBLE_LINUX_SHA256 before it is unpacked.
      PEBBLE_VERSION: v2.10.1
      # SHA-256 of pebble-linux-amd64.tar.gz of the v2.10.1 release. NOT FILLED IN: it could not
      # be fetched where this workflow was written (P-GH: download the asset once, run
      # `sha256sum` on it and paste the value here; the install step fails until then).
      PEBBLE_LINUX_SHA256: "FILL-IN-SHA256-OF-pebble-linux-amd64.tar.gz-v2.10.1"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq sqlite3 curl openssl postgresql-client shellcheck

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal --component rustfmt --component clippy "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup show active-toolchain

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Pebble
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pebble.tar.gz" \
            "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/pebble-linux-amd64.tar.gz"
          echo "${PEBBLE_LINUX_SHA256}  $RUNNER_TEMP/pebble.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/pebble"
          tar -xzf "$RUNNER_TEMP/pebble.tar.gz" -C "$RUNNER_TEMP/pebble"
          bin="$(find "$RUNNER_TEMP/pebble" -type f -name pebble | head -n 1)"
          chmod +x "$bin"
          echo "PEBBLE_BIN=$bin" >> "$GITHUB_ENV"

      # scripts/check.sh runs shellcheck at its default severity, and two older scripts have
      # info-level findings (redteam-live.sh SC2016, verify-hooks.sh SC2018/SC2019: TM30 report,
      # F4). Until they are fixed, this step only fails on warnings and errors; the strict run
      # of the smoke script is its own step below.
      - name: scripts/check.sh
        env:
          SHELLCHECK_OPTS: "--severity=warning"
        run: bash scripts/check.sh

      - name: Postgres store tests (TM26)
        run: |
          set -euo pipefail
          cargo test --locked -p awm-server --features pg,sqlite --test store_conformance --test store_pg
          cargo test --locked -p awm-server --features pg,sqlite --test delete_retention --test authz

      - name: ACME tests against Pebble (TM15)
        run: cargo test --locked -p awm-server --features all --test serve_tls --test serve_check --test serve_config

      - name: Hook without network (TM13)
        run: |
          set -euo pipefail
          if [ -f scripts/hook-nonet.sh ]; then
            bash scripts/hook-nonet.sh
          else
            echo "scripts/hook-nonet.sh does not exist yet (TM13): skipped"
          fi

      - name: Release binary
        run: cargo build --release --locked -p agent-web-memory --features sync,serve

      - name: systemd unit (verify and exposure score)
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin awm || true
          sudo install -m 0755 target/release/awm /usr/local/bin/awm
          sudo install -d -m 0755 /etc/awm
          sudo install -m 0600 /dev/null /etc/awm/serve.env
          systemd-analyze verify deploy/systemd/awm-serve.service
          out="$(systemd-analyze security --no-pager --offline=true deploy/systemd/awm-serve.service)"
          printf '%s\n' "$out"
          score="$(printf '%s\n' "$out" | sed -n 's/.*Overall exposure level for [^:]*: \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | tail -n 1)"
          if [ -z "$score" ]; then
            echo "no 'Overall exposure level' line in the systemd-analyze security output" >&2
            exit 1
          fi
          echo "exposure level: $score (limit 3.0)"
          awk -v s="$score" 'BEGIN { exit !(s <= 3.0) }'

      - name: Container image
        run: docker build -t awm:dev .

      - name: Smoke, SqliteStore with built-in TLS against Pebble
        run: bash scripts/selfhost-smoke.sh --store sqlite --tls pebble

      - name: Smoke, PgStore against the service container
        run: bash scripts/selfhost-smoke.sh --store pg

      - name: Smoke, container image
        run: bash scripts/selfhost-smoke.sh --image awm:dev

      - name: Smoke, 20,000 seeded records (restore time)
        env:
          AWM_SMOKE_MAX_RESTORE_S: "60"
        run: bash scripts/selfhost-smoke.sh --store sqlite --tls pebble --seed 20000

      - name: shellcheck (the smoke script, strict)
        run: shellcheck scripts/selfhost-smoke.sh

      - name: shellcheck (the other scripts and the hook, warnings and errors)
        run: |
          set -euo pipefail
          files=(plugin/hooks/awm-hook)
          for f in scripts/*.sh; do
            [ "$f" = scripts/selfhost-smoke.sh ] || files+=("$f")
          done
          shellcheck --severity=warning "${files[@]}"

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal --component rustfmt --component clippy "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup show active-toolchain

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: scripts/check.sh
        run: bash scripts/check.sh
