[package]
name = "agent-web-memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "awm"

[[bin]]
name = "awm"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
url = "2.5.8"
unicode-normalization = "0.1.25"
sha2 = "0.11.0"
regex = "1.13.1"
directories = "6.0.0"
toml = "1.1.6"
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset", "macros"] }
walkdir = "2.5.0"
csv = { version = "1.4.0", optional = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
awm-proto = { path = "../awm-proto", optional = true }
awm-server = { path = "../awm-server", features = ["all"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
bench = ["dep:csv"]
# Team sync client (plan-v3-team 4.1): `awm sync` only; the default build has no HTTP client.
sync = ["dep:ureq", "dep:awm-proto"]
# `awm serve`: links the server crate.
serve = ["dep:awm-server", "dep:awm-proto"]
