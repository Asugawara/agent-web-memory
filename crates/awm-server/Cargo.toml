[package]
name = "awm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Server for awm team sync (plan-v3-team 4.1, 4.2)"

[dependencies]
awm-proto = { path = "../awm-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "sync"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
ring = { version = "0.17", optional = true }
# object_store's own `gcp` and `aws` features force aws-lc-rs (CMake and a C toolchain);
# the `-base` features plus `ring` and reqwest's `rustls-no-provider` keep `ring` as the one provider.
object_store = { version = "0.14.2", default-features = false, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]
pg = ["dep:tokio-postgres", "dep:deadpool-postgres"]
acme = ["dep:instant-acme", "dep:rcgen", "dep:rustls", "dep:tokio-rustls", "dep:ring"]
backup-gcs = ["object-store-ring", "object_store/gcp-base"]
backup-s3 = ["object-store-ring", "object_store/aws-base"]
object-store-ring = ["dep:object_store", "dep:reqwest", "dep:rustls", "object_store/reqwest", "object_store/ring"]
all = ["sqlite", "pg", "acme", "backup-gcs", "backup-s3"]
