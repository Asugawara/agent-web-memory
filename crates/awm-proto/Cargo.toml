[package]
name = "awm-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wire types, record envelope and key handling for awm team sync (plan-v3-team 4.1, 5.1)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = "0.11.0"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
