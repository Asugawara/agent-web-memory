# cargo-deny configuration (plan-v3-team §4.1): licences only, checked by scripts/check.sh.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# The cloud crate (TM18) is FSL-1.1-ALv2 and never published.
[licenses.private]
ignore = true
